# AlphaQuant 全局配置

# 账户配置
account:
  qmt_path_simulated: "D:/国金QMT交易端模拟/userdata_mini"
  qmt_path_real: "D:/国金QMT交易端模拟/userdata_mini"
  account_simulated: "55012491"
  account_real: "55012491"
  is_real: false                  # true=实盘, false=模拟盘

# 历史 K 线来源（策略 config 可覆盖）：不传=东财→QMT→AkShare→TDX；可选 qmt / eastmoney / akshare / tdx / 按顺序
# hist_data_source: "qmt"

# 资金配置
capital:
  initial_capital: 1000000.0
  max_position_ratio: 0.2         # 单标的最大仓位比例

# 交易配置
trading:
  slippage: 0.01                  # 滑点（元）
  commission: 0.0003              # 佣金率（双边）
  stamp_duty: 0.001               # 印花税（卖出单边）

# 日志配置（文件落盘目录默认 alphaQuantSystem/logs；log_dir 为相对路径时相对包根）
logging:
  level: "INFO"
  log_dir: "logs"
  rotation: "1 day"
  retention: "30 days"

# 事件引擎
event_engine:
  timer_interval: 1.0             # 定时心跳间隔（秒）

# 风控配置（覆盖 RiskLimits 默认值）
risk:
  max_position_size: 0.3
  max_drawdown: 0.15
  daily_max_loss: 500000
  ban_limit_up_down: true
  # 与 A 股连续竞价时段一致（若需避开开盘/收盘可再改窄）
  trade_time_windows:
    - ["09:30", "11:30"]
    - ["13:00", "15:00"]
  blacklist_symbols: []
  whitelist_symbols: []

# 股票池配置
stock_pool:
  enabled: false
  symbols: []
  period: "D"
  start_date: "20200101"
  end_date: "20500101"
  # hist_data_source: "按顺序"   # 可选；run_pool_once 拉 K 时传给 DataEngine
